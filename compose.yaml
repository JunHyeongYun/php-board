services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: php-board-container
    network_mode: "host"
    volumes:
      - ./src:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  nginx:
    image: nginx:latest
    container_name: nginx-container
    ports:
      - "8082:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./src:/var/www/html
    depends_on:
      - php